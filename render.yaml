services:
  - type: web
    name: ai-link-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      # Secret: set the value in the Render dashboard, never in git.
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_PRIMARY_MODEL
        value: gemini-3-flash-preview
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.5-flash
      - key: LLM_REASONING_EFFORT
        value: medium
